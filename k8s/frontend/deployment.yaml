apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deepskyn
  annotations:
    kubernetes.io/change-cause: "initial deploy"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: nexus-registry-secret
      containers:
        - name: frontend
          image: 192.168.32.128:8082/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.1
          args:
            - --nginx.scrape-uri=http://127.0.0.1:80/nginx_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"

