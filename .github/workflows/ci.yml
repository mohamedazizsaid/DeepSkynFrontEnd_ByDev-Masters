name: CI — React Vite Frontend

on:
  push:
    branches: [main, develop, hamzadl , SalimBranch ]

  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Build only ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed for SonarQube blame data

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create build archive
        run: tar -czf frontend-dist-${GITHUB_SHA::8}.tar.gz dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-archive
          path: frontend-dist-*.tar.gz
          if-no-files-found: error

  # ── Job 2: Nexus/Artifactory stage ───────────────────────
  nexus:
    name: Nexus · Artifactory Stage
    runs-on: ubuntu-latest
    needs: build
    env:
      HAS_NEXUS_CREDS: ${{ secrets.NEXUS_URL != '' && secrets.NEXUS_REPOSITORY != '' && secrets.NEXUS_USERNAME != '' && secrets.NEXUS_PASSWORD != '' }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-archive
          path: .

      - name: Upload package to Nexus
        if: ${{ env.HAS_NEXUS_CREDS == 'true' }}
        run: |
          FILE="$(ls frontend-dist-*.tar.gz | head -n 1)"
          curl --fail --show-error --silent \
            -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$FILE" \
            "${{ secrets.NEXUS_URL }}/repository/${{ secrets.NEXUS_REPOSITORY }}/$FILE"

      - name: Nexus status
        if: ${{ env.HAS_NEXUS_CREDS != 'true' }}
        run: echo "Skipping Nexus upload (missing NEXUS_URL/NEXUS_REPOSITORY/NEXUS_USERNAME/NEXUS_PASSWORD)."

  # ── Job 3: SonarQube ─────────────────────────────────────
  sonar:
    name: SonarQube Scan · Quality Gate
    runs-on: self-hosted
    needs: nexus

    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarQube status
        if: ${{ env.HAS_SONAR_TOKEN != 'true' }}
        run: echo "Skipping SonarQube (missing SONAR_TOKEN)."

      - name: SonarQube Scan
        if: ${{ env.HAS_SONAR_TOKEN == 'true' }}
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://192.168.254.128:9000

      - name: SonarQube Quality Gate
        if: ${{ env.HAS_SONAR_TOKEN == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://192.168.254.128:9000

  # ── Job 4: Docker Build + Push (main only) ───────────────
  docker:
    name: Docker Build · Push
    runs-on: ubuntu-latest
    needs: sonar
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ steps.tag.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
