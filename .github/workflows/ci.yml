name: CI — React Vite Frontend

on:
  push:
    branches: [main, develop, hamzadl, SalimBranch]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXUS_REGISTRY: 192.168.32.128:8082
  IMAGE_NAME: 192.168.32.128:8082/frontend

jobs:

  # ── Job 1: Build (cloud runner — no internal access needed) ──
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create build archive
        run: tar -czf frontend-dist-${GITHUB_SHA::8}.tar.gz dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-archive
          path: frontend-dist-*.tar.gz
          if-no-files-found: error

  # ── Job 2: Nexus Artifactory Stage (self-hosted — needs internal network) ──
  nexus:
    name: Nexus · Artifactory Stage
    runs-on: self-hosted
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-archive
          path: .

      - name: Upload package to Nexus
        run: |
          FILE="$(ls frontend-dist-*.tar.gz | head -n 1)"
          curl --fail --show-error --silent \
            -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$FILE" \
            "http://${NEXUS_REGISTRY}/repository/frontend-releases/$FILE"

  # ── Job 3: SonarQube (self-hosted — needs internal network) ──
  sonar:
    name: SonarQube Scan · Quality Gate
    runs-on: self-hosted
    needs: nexus

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov
        continue-on-error: true

      - name: Check SonarQube reachability
        id: sonar-check
        run: |
          if curl --silent --fail --max-time 10 \
            "http://192.168.32.128:9000/api/server/version" > /dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "✅ SonarQube reachable"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SonarQube unreachable — skipping scan"
          fi

      - name: SonarQube Scan
        if: steps.sonar-check.outputs.reachable == 'true' && secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://192.168.32.128:9000

      - name: SonarQube Quality Gate
        if: steps.sonar-check.outputs.reachable == 'true' && secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://192.168.32.128:9000

  # ── Job 4: Docker Build + Push to Nexus (self-hosted — needs internal network) ──
  docker:
    name: Docker Build · Push to Nexus
    runs-on: self-hosted
    needs: [build, sonar]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Login to Nexus registry
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | \
            docker login ${{ env.NEXUS_REGISTRY }} \
              -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Trigger Jenkins CD (self-hosted — needs internal network) ──
  trigger-cd:
    name: Trigger Jenkins CD
    runs-on: self-hosted
    needs: docker
    if: needs.docker.result == 'success'

    steps:
      - name: Trigger Jenkins frontend-cd job
        run: |
          curl --fail --silent \
            -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "http://192.168.32.128:8080/job/frontend-cd/buildWithParameters?IMAGE_TAG=${{ needs.docker.outputs.image_tag }}"
          echo "✅ Jenkins CD triggered with IMAGE_TAG=${{ needs.docker.outputs.image_tag }}"