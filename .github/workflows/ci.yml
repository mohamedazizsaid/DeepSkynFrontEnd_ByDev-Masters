name: CI — React Vite Frontend

on:
  push:
    branches: [main, develop, hamzadl , SalimBranch ]

  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Build only ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed for SonarQube blame data

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create build archive
        run: tar -czf frontend-dist-${GITHUB_SHA::8}.tar.gz dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-archive
          path: frontend-dist-*.tar.gz
          if-no-files-found: error

  # ── Job 2: Nexus/Artifactory stage ───────────────────────
  nexus:
    name: Nexus · Artifactory Stage
    runs-on: ubuntu-latest
    needs: build
    env:
      NEXUS_URL: ${{ secrets.NEXUS_URL || vars.NEXUS_URL }}
      NEXUS_REPOSITORY: ${{ secrets.NEXUS_REPOSITORY || vars.NEXUS_REPOSITORY }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME || secrets.NEXUS_USER || vars.NEXUS_USERNAME || vars.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PASS }}
      HAS_NEXUS_CREDS: ${{ (secrets.NEXUS_URL != '' || vars.NEXUS_URL != '') && (secrets.NEXUS_REPOSITORY != '' || vars.NEXUS_REPOSITORY != '') && (secrets.NEXUS_USERNAME != '' || secrets.NEXUS_USER != '' || vars.NEXUS_USERNAME != '' || vars.NEXUS_USER != '') && (secrets.NEXUS_PASSWORD != '' || secrets.NEXUS_PASS != '') }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-archive
          path: .

      - name: Upload package to Nexus
        if: ${{ env.HAS_NEXUS_CREDS == 'true' }}
        run: |
          FILE="$(ls frontend-dist-*.tar.gz | head -n 1)"
          curl --fail --show-error --silent \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            --upload-file "$FILE" \
            "${NEXUS_URL}/repository/${NEXUS_REPOSITORY}/$FILE"

      - name: Nexus status
        if: ${{ env.HAS_NEXUS_CREDS != 'true' }}
        run: echo "Skipping Nexus upload (missing NEXUS_URL/NEXUS_REPOSITORY/NEXUS_USERNAME/NEXUS_PASSWORD)."

  # ── Job 3: SonarQube ─────────────────────────────────────
  sonar:
    name: SonarQube Scan · Quality Gate
    runs-on: ubuntu-latest
    needs: nexus

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARQUBE_TOKEN }}
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' || secrets.SONARQUBE_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        continue-on-error: true
        run: npm run test:cov

      - name: Resolve SonarQube URL
        id: sonar-config
        env:
          RAW_SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
        run: |
          SONAR_URL="${RAW_SONAR_HOST_URL:-http://192.168.254.128:9000}"
          echo "sonar_url=$SONAR_URL" >> "$GITHUB_OUTPUT"

      - name: SonarQube status
        if: ${{ env.HAS_SONAR_TOKEN != 'true' }}
        run: echo "Skipping SonarQube (missing SONAR_TOKEN)."

      - name: Check SonarQube reachability
        id: sonar-reachability
        if: ${{ env.HAS_SONAR_TOKEN == 'true' }}
        run: |
          if curl --silent --fail --show-error --max-time 10 "${{ steps.sonar-config.outputs.sonar_url }}/api/server/version" > /dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube reachable at ${{ steps.sonar-config.outputs.sonar_url }}."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube unreachable at ${{ steps.sonar-config.outputs.sonar_url }}. Skipping scan."
          fi

      - name: SonarQube Scan
        if: ${{ env.HAS_SONAR_TOKEN == 'true' && steps.sonar-reachability.outputs.reachable == 'true' }}
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.sonar_url }}

      - name: SonarQube Quality Gate
        if: ${{ env.HAS_SONAR_TOKEN == 'true' && steps.sonar-reachability.outputs.reachable == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.sonar_url }}

  # ── Job 4: Docker Build + Push ────────────────────────────
  docker:
    name: Docker Build · Push
    runs-on: ubuntu-latest
    needs: [build, sonar]
    if: ${{ always() && github.event_name == 'push' && needs.build.result == 'success' && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image tags
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          {
            echo "tags<<EOF"
            echo "${{ secrets.DOCKERHUB_USERNAME }}/frontend:${BRANCH_TAG}-${SHORT_SHA}"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
